name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files (for debugging)
        run: ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Find Gradle and Build APK
        run: |
          if [ -f "gradlew" ]; then
            echo "Found gradlew in root directory."
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "android/gradlew" ]; then
            echo "Found gradlew in android/ directory."
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew not found! You must commit your 'gradlew' file and 'gradle/wrapper' folder to GitHub."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          # The ** wildcard automatically searches all subfolders for the generated APK
          path: '**/*.apk'
          retention-days: 7
