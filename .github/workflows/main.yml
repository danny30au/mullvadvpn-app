name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android \
                            armv7-linux-androideabi \
                            i686-linux-android \
                            x86_64-linux-android

      - name: Find Gradle and Build APK
        run: |
          if [ -f "gradlew" ]; then
            echo "Found gradlew in root directory."
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "android/gradlew" ]; then
            echo "Found gradlew in android/ directory."
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew not found! You must commit your 'gradlew' file and 'gradle/wrapper' folder to GitHub."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/*.apk'
          retention-days: 7
